# Firecrawl 多 Key 反向代理 — 容器化部署
#
# 快速开始：
#   1. cp .env.example .env，填写 PUBLIC_BASE_URL 与 ADMIN_PASSWORD
#   2. docker compose up -d
#   3. 打开 $PUBLIC_BASE_URL 进入管理面板
#
# 启用内置 Caddy TLS 网关（需要域名已解析到本机）：
#   docker compose --profile tls up -d
#
# proxy 默认只把端口绑到宿主机回环地址（127.0.0.1:8080），公网访问不到。
# 生产部署时由 caddy 或你自己的 Nginx 提供 TLS 与对外入口。

services:
  proxy:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_PATH: /data/proxy.db
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-https://api.firecrawl.dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROXY_PATH_PREFIXES: ${PROXY_PATH_PREFIXES:-/v1/,/v2/}
      MAX_FAILOVER_ATTEMPTS: ${MAX_FAILOVER_ATTEMPTS:-3}
      DEFAULT_COOLDOWN_SECONDS: ${DEFAULT_COOLDOWN_SECONDS:-60}
      MAX_REQUEST_BUFFER_BYTES: ${MAX_REQUEST_BUFFER_BYTES:-8388608}
      JOB_ROUTE_TTL_HOURS: ${JOB_ROUTE_TTL_HOURS:-48}
      CREDIT_REFRESH_MINUTES: ${CREDIT_REFRESH_MINUTES:-10}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
    volumes:
      - proxy-data:/data
    # 只绑回环地址：本机浏览器能打开面板，公网访问不到。
    # 用内置 caddy（--profile tls）或外部网关时，它们走 compose 网络直连容器，
    # 与这条映射互不影响。若要让局域网其他机器直接访问，改成 "0.0.0.0:8080:8080"
    # ——但那意味着面板登录走明文 HTTP，只在可信内网这么做。
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 先编辑 Caddyfile.example 里的域名，再启用本 profile。
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - proxy

  # ---- 可选：MCP 端点（--profile mcp）----
  # 给只支持远程 MCP、无法自定义 Firecrawl 地址的客户端用（如 Android 上的
  # RikkaHub：传输类型只有 Streamable HTTP / SSE，起不了 npx 本地进程）。
  #
  # 链路：客户端 → mcp-gate(校验 token) → firecrawl-mcp → 本代理 → 上游 Key 池
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    restart: unless-stopped
    profiles: ["mcp"]
    environment:
      # 指向本代理的对外地址，让 MCP 的所有抓取都走 Key 池调度
      FIRECRAWL_API_URL: ${PUBLIC_BASE_URL}
      # 面板里创建的调用 Key。MCP 服务端不接受客户端自带的 key，只能烘在这里
      FIRECRAWL_API_KEY: ${MCP_PROXY_KEY}
    expose:
      - "3000"

  mcp-gate:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["mcp"]
    environment:
      MCP_ACCESS_TOKEN: ${MCP_ACCESS_TOKEN}
    volumes:
      - ./Caddyfile.mcp:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8082}:3000"
    depends_on:
      - mcp

volumes:
  proxy-data:
  caddy-data:
  caddy-config: